name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preserve last published data snapshots
        shell: bash
        env:
          ARTEMIS_SNAPSHOT_BASE_URL: https://artemis.realgar.ch/data
        run: |
          for snapshot in spaceweather.json dsn.json trajectory-artemis-ii.json status.json; do
            temporary="public/data/.${snapshot}.tmp"
            if curl --fail --silent --show-error --location --max-time 12 --max-filesize 1048576 "${ARTEMIS_SNAPSHOT_BASE_URL}/${snapshot}" --output "${temporary}"; then
              mv "${temporary}" "public/data/${snapshot}"
            else
              rm -f "${temporary}"
              echo "No previous published ${snapshot}; the generator will use a validated seed or unavailable state."
            fi
          done

      - name: Validate mission catalog
        run: npm run validate:catalog

      - name: Regenerate pinned flight ephemeris datasets
        run: npm run prepare:ephemeris

      - name: Refresh public data snapshots
        run: npm run generate-data

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          cp dist/index.html dist/404.html
          cp CNAME dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout live-site verifier
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed routes and public data
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-live-site.mjs
